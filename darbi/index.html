grid.innerHTML=list.map(j=>`<article class="card"><div class="badges"><span class="badge ${j.open?"open":"check"}">${j.open?"Līdz "+esc(j.deadline):"Termiņš jāpārbauda"}</span><span class="badge">Atbilstība: ${esc(j.fit)}</span>${applied[j.slug]?'<span class="badge done">Pieteikts</span>':""}</div><h2>${esc(j.title)}</h2><p class="emp">${esc(j.employer)}</p><p class="facts"><b>${esc(j.salary)}</b><br>${esc(j.place)}</p><button class="btn primary" data-open="${esc(j.slug)}">Skatīt CV un pieteikties</button></article>`).join("")||"<p>Nav piedāvājumu ar šo filtru.</p>"}
function show(slug){const j=JOBS.find(x=>x.slug===slug);dTitle.textContent=j.title;dSub.textContent=`${j.employer}, ${j.place}, ${j.salary}`;dCv.src=`${j.slug}/cv.html`;
const channels=[`<a class="btn primary" href="${esc(j.url)}" target="_blank" rel="noopener">Atvērt sludinājumu</a>`];if(j.mail)channels.push(`<a class="btn" href="${esc(j.mail)}">Rakstīt e-pastu</a>`);if(j.wa)channels.push(`<a class="btn" href="${esc(j.wa)}" target="_blank" rel="noopener">WhatsApp</a>`);channels.push(`<a class="btn" href="${j.slug}/${pdfName}" download>CV bez kontaktiem</a>`);
dInfo.innerHTML=`<h3>Pienākumi</h3><p>${esc(j.duties)}</p><h3>Prasības</h3><p>${esc(j.needs)}</p><h3>Kas atbilst</h3><ul>${j.match.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><h3>Kā pieteikties</h3><p>${esc(j.apply)}</p><div class="actions">${channels.join("")}</div><h3>Pieteikuma vēstule</h3><textarea id="letter" aria-label="Pieteikuma vēstule">${esc(j.letter)}</textarea><div class="actions"><button class="btn" id="copy">Kopēt vēstuli</button></div><label class="applied"><input type="checkbox" id="done" ${applied[j.slug]?"checked":""}> Esmu pieteicies</label>`;
copy.onclick=async()=>{try{await navigator.clipboard.writeText(letter.value)}catch{letter.select();document.execCommand("copy")}copy.textContent="Nokopēts"};done.onchange=()=>{if(done.checked)applied[j.slug]=true;else delete applied[j.slug];save();render()};dlg.showModal()}
document.querySelector(".filters").onclick=ev=>{const b=ev.target.closest("button");if(!b)return;filter=b.dataset.f;document.querySelectorAll(".filters button").forEach(x=>x.setAttribute("aria-pressed",x===b));render()};
grid.onclick=ev=>{const b=ev.target.closest("[data-open]");if(b)show(b.dataset.open)};dClose.onclick=()=>dlg.close();dlg.onclick=ev=>{if(ev.target===dlg)dlg.close()};render();const linked=location.hash.slice(1);if(JOBS.some(j=>j.slug===linked))show(linked);
</script>
</body>
</html>
