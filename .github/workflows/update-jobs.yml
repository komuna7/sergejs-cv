name: Update vacancies

on:
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch vacancies
        run: python3 .github/scripts/fetch_nva.py darbi/nva.json
      - name: Publish changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- darbi/nva.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add darbi/nva.json
          git commit -m "Update vacancies"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
